version: "3.8"

services:
  music-app:
    image: sruthikumari94/musicwave:latest
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true"
    volumes:
      - music-data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
      placement:
        constraints:
          - node.role == worker

volumes:
  music-data:
    driver: local
