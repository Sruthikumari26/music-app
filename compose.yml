version: '3.8'

services:
  music-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-app:latest
    container_name: musicwave-app
    environment:
      # Pass environment variables if needed
      - JAVA_OPTS=-Djava.awt.headless=true
    volumes:
      # Persist the SQLite database so users don't lose accounts when container restarts
      - music-data:/app/data
    # For a GUI app, we use a virtual display (Xvfb) if running headless
    # If running on a Linux desktop with X11, uncomment the following lines:
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    restart: unless-stopped

volumes:
  music-data:
    driver: local
